<script>

/* =================================
   SUPABASE CONNECTION
================================= */

const SUPABASE_URL =
"https://onfrahdbophlwamtooqw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4RBqOE_lbkAXHk0CXH1Qsg_YkFdPFRo";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =================================
   LOAD NOTES
================================= */

async function loadNotes(){

    const message =
    document.getElementById("message");

    const container =
    document.getElementById(
        "materialsContainer"
    );


    const {data,error} =
    await supabaseClient

    .from("materials")

    .select("*")

    .eq("category","Notes")

    .order("created_at",{
        ascending:false
    });


    if(error){

        console.error(error);

        message.innerHTML =
        "❌ Failed to load notes.";

        return;
    }


    if(!data || data.length === 0){

        message.innerHTML =
        "📚 No notes available yet.";

        return;
    }


    message.innerHTML = "";

    container.innerHTML = "";


    data.forEach(function(material){

        const card =
        document.createElement("div");

        card.className =
        "material-card";


        const title =
        escapeHTML(material.title);


        const subject =
        escapeHTML(material.subject);


        const formClass =
        escapeHTML(
            material.form_class ||
            "Not specified"
        );


        card.innerHTML = `

            <div class="material-icon">
                📄
            </div>

            <h3>
                ${title}
            </h3>

            <p>
                <strong>Subject:</strong>
                ${subject}
            </p>

            <p>
                <strong>Form/Class:</strong>
                ${formClass}
            </p>

            <button
                class="view-btn"
                type="button"
            >
                📖 VIEW PDF
            </button>

        `;


        const button =
        card.querySelector(
            ".view-btn"
        );


        /* =================================
           OPEN PDF
        ================================= */

        button.addEventListener(
            "click",
            function(){

                const pdfURL =
                material.file_url;


                if(!pdfURL){

                    alert(
                        "❌ PDF URL haipo kwenye database."
                    );

                    return;
                }


                /*
                   Open the original
                   Supabase public URL.
                   No download parameter.
                */

                window.open(
                    pdfURL,
                    "_blank"
                );

            }
        );


        container.appendChild(card);

    });

}


/* =================================
   SEARCH
================================= */

document
.getElementById("searchInput")
.addEventListener(
    "input",
    function(){

        const search =
        this.value
        .toLowerCase()
        .trim();


        const cards =
        document.querySelectorAll(
            ".material-card"
        );


        cards.forEach(
            function(card){

                const text =
                card.textContent
                .toLowerCase();


                if(
                    text.includes(search)
                ){

                    card.style.display =
                    "";

                }else{

                    card.style.display =
                    "none";

                }

            }
        );

    }
);


/* =================================
   SECURITY
================================= */

function escapeHTML(value){

    if(!value){
        return "";
    }


    return String(value)

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =================================
   START
================================= */

loadNotes();

</script>
