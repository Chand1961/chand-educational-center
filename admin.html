<!DOCTYPE html>

<head>

<title>Admin Panel - CHAND INSTITUTE OF TECHNOLOGY</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;

<body>

<div class="header">

    <h1>CHAND INSTITUTE OF TECHNOLOGY</h1>

<div class="container">

    <div class="card">

<script>

/* =========================================
   SUPABASE CONNECTION
========================================= */

const SUPABASE_URL =
    "https://onfrahdbophlwamtooqw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_4RBqOE_lbkAXHk0CXH1Qsg_YkFdPFRo";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   MESSAGE FUNCTION
========================================= */

function showMessage(text, type){

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className = "";

    message.classList.add(type);

    message.style.display = "block";
}


/* =========================================
   UPLOAD MATERIAL
========================================= */

async function uploadMaterial(){

    const title =
        document.getElementById("title").value.trim();

    const category =
        document.getElementById("category").value;

    const subject =
        document.getElementById("subject").value;

    const formClass =
        document.getElementById("formClass").value.trim();

    const file =
        document.getElementById("pdfFile").files[0];


    /* CHECK TITLE */

    if(!title){

        showMessage(
            "Please enter the material title.",
            "error"
        );

        return;
    }


    /* CHECK CATEGORY */

    if(!category){

        showMessage(
            "Please select a category.",
            "error"
        );

        return;
    }


    /* CHECK SUBJECT */

    if(!subject){

        showMessage(
            "Please select a subject.",
            "error"
        );

        return;
    }


    /* CHECK PDF */

    if(!file){

        showMessage(
            "Please select a PDF file.",
            "error"
        );

        return;
    }


    /* CHECK PDF TYPE */

    const isPDF =
        file.type === "application/pdf" ||
        file.name.toLowerCase().endsWith(".pdf");


    if(!isPDF){

        showMessage(
            "Only PDF files are allowed.",
            "error"
        );

        return;
    }


    /* SHOW UPLOADING */

    showMessage(
        "Uploading PDF, please wait...",
        "success"
    );


    try{

        /* =====================================
           CREATE UNIQUE FILE NAME
        ===================================== */

        const safeFileName =
            file.name.replace(/[^a-zA-Z0-9._-]/g,"_");


        const filePath =
            Date.now() + "_" + safeFileName;


        /* =====================================
           UPLOAD PDF TO SUPABASE STORAGE

           IMPORTANT:
           contentType = application/pdf
        ===================================== */

        const {
            data: uploadData,
            error: uploadError
        } = await supabaseClient

            .storage

            .from("materials")

            .upload(
                filePath,
                file,
                {
                    cacheControl: "3600",
                    upsert: false,
                    contentType: "application/pdf"
                }
            );


        /* =====================================
           CHECK UPLOAD ERROR
        ===================================== */

        if(uploadError){

            console.error(uploadError);

            throw uploadError;
        }


        /* =====================================
           GET PUBLIC URL
        ===================================== */

        const {
            data: publicUrlData
        } =
            supabaseClient

            .storage

            .from("materials")

            .getPublicUrl(filePath);


        const fileUrl =
            publicUrlData.publicUrl;


        /* =====================================
           SAVE INFORMATION TO DATABASE
        ===================================== */

        const {
            data: insertData,
            error: insertError
        } =
            await supabaseClient

            .from("materials")

            .insert([

                {
                    title: title,
                    category: category,
                    subject: subject,
                    form_class: formClass,
                    file_url: fileUrl
                }

            ]);


        /* =====================================
           CHECK DATABASE ERROR
        ===================================== */

        if(insertError){

            console.error(insertError);

            throw insertError;
        }


        /* =====================================
           SUCCESS
        ===================================== */

        showMessage(
            "PDF uploaded successfully!",
            "success"
        );


        /* CLEAR FORM */

        document.getElementById("title").value = "";

        document.getElementById("category").value = "";

        document.getElementById("subject").value = "";

        document.getElementById("formClass").value = "";

        document.getElementById("pdfFile").value = "";


    }catch(error){

        console.error(error);


        showMessage(
            "Upload failed: " + error.message,
            "error"
        );

    }

}

</script>

</body>

</html>
