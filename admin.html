<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel - CHAND INSTITUTE OF TECHNOLOGY</title>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#123c69;
    padding-bottom:40px;
}

header{
    background:linear-gradient(135deg,#123c69,#1769aa);
    color:white;
    padding:28px 15px;
    text-align:center;
    border-radius:0 0 25px 25px;
}

header h1{
    font-size:24px;
    margin-bottom:8px;
}

header p{
    font-size:14px;
    opacity:0.9;
}

.container{
    max-width:700px;
    margin:25px auto;
    padding:0 15px;
}

.admin-card{
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 18px rgba(0,0,0,0.08);
}

.admin-card h2{
    text-align:center;
    margin-bottom:8px;
}

.description{
    text-align:center;
    color:#666;
    font-size:14px;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
    font-size:14px;
}

.form-group input,
.form-group select{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:14px;
    background:white;
}

.form-group input:focus,
.form-group select:focus{
    border-color:#1769aa;
}

.file-box{
    border:2px dashed #1769aa;
    border-radius:12px;
    padding:20px;
    text-align:center;
    background:#f8fbff;
}

.file-box input{
    width:100%;
}

.upload-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:25px;
    background:#1769aa;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.upload-btn:hover{
    background:#123c69;
}

.upload-btn:disabled{
    background:#999;
    cursor:not-allowed;
}

#message{
    margin-top:18px;
    text-align:center;
    font-size:14px;
    font-weight:bold;
    line-height:1.5;
}

.back-btn{
    display:block;
    text-align:center;
    margin-top:20px;
    text-decoration:none;
    color:#1769aa;
    font-weight:bold;
}

@media(max-width:500px){

    .admin-card{
        padding:20px;
    }

    header h1{
        font-size:21px;
    }

}

</style>

</head>


<body>


<header>

    <h1>CHAND INSTITUTE OF TECHNOLOGY</h1>

    <p>Admin Panel - Educational Materials</p>

</header>


<div class="container">

<div class="admin-card">

    <h2>📤 Upload Educational Material</h2>

    <p class="description">
        Upload PDF materials for students to access.
    </p>


    <form id="uploadForm">


        <!-- TITLE -->

        <div class="form-group">

            <label for="title">
                Material Title
            </label>

            <input
                type="text"
                id="title"
                placeholder="Example: Form One Mathematics Notes"
                required
            >

        </div>


        <!-- CATEGORY -->

        <div class="form-group">

            <label for="category">
                Category
            </label>

            <select id="category" required>

                <option value="">
                    Select Category
                </option>

                <option value="Notes">
                    Notes
                </option>

                <option value="Past Papers">
                    Past Papers
                </option>

                <option value="Lesson Plans">
                    Lesson Plans
                </option>

                <option value="Schemes of Work">
                    Schemes of Work
                </option>

                <option value="Syllabus">
                    Syllabus
                </option>

                <option value="Examinations">
                    Examinations
                </option>

            </select>

        </div>


        <!-- SUBJECT -->

        <div class="form-group">

            <label for="subject">
                Subject
            </label>

            <select id="subject" required>

                <option value="">
                    Select Subject
                </option>

                <option value="Mathematics">
                    Mathematics
                </option>

                <option value="English">
                    English
                </option>

                <option value="Biology">
                    Biology
                </option>

                <option value="Physics">
                    Physics
                </option>

                <option value="Chemistry">
                    Chemistry
                </option>

                <option value="Computer Studies / ICT">
                    Computer Studies / ICT
                </option>

                <option value="Business Studies">
                    Business Studies
                </option>

                <option value="History">
                    History
                </option>

                <option value="Tanzania History and Ethics">
                    Tanzania History and Ethics
                </option>

            </select>

        </div>


        <!-- FORM / CLASS -->

        <div class="form-group">

            <label for="formClass">
                Form / Class
            </label>

            <input
                type="text"
                id="formClass"
                placeholder="Example: Form One"
            >

        </div>


        <!-- PDF -->

        <div class="form-group">

            <label for="pdfFile">
                Select PDF
            </label>

            <div class="file-box">

                <input
                    type="file"
                    id="pdfFile"
                    accept=".pdf,application/pdf"
                    required
                >

            </div>

        </div>


        <button
            type="submit"
            class="upload-btn"
            id="uploadButton"
        >
            📤 UPLOAD PDF
        </button>


    </form>


    <div id="message"></div>


    <a
        href="index.html"
        class="back-btn"
    >
        ← Back to Home
    </a>

</div>

</div>


<script>

/* ================================
   SUPABASE CONNECTION
================================ */

const SUPABASE_URL =
    "https://onfrahdbophlwamtooqw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_4RBqOE_lbkAXHk0CXH1Qsg_YkFdPFRo";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ================================
   UPLOAD FORM
================================ */

document
.getElementById("uploadForm")
.addEventListener("submit", async function(event){

    event.preventDefault();


    const title =
        document.getElementById("title").value.trim();

    const category =
        document.getElementById("category").value;

    const subject =
        document.getElementById("subject").value;

    const formClass =
        document.getElementById("formClass").value.trim();

    const file =
        document.getElementById("pdfFile").files[0];

    const message =
        document.getElementById("message");

    const uploadButton =
        document.getElementById("uploadButton");


    /* CHECK FILE */

    if(!file){

        message.innerText =
            "❌ Please select a PDF file.";

        return;

    }


    if(file.type !== "application/pdf"){

        message.innerText =
            "❌ Only PDF files are allowed.";

        return;

    }


    /* START */

    uploadButton.disabled = true;

    uploadButton.innerText =
        "⏳ Uploading...";

    message.innerText =
        "Please wait...";


    try{

        /* CREATE UNIQUE FILE NAME */

        const fileName =
            Date.now() + "_" +
            file.name.replace(/\s+/g,"_");


        const filePath =
            fileName;


        /* =========================
           UPLOAD PDF TO STORAGE
        ========================= */

        const { data: storageData, error: storageError } =
            await supabaseClient
            .storage
            .from("materials")
            .upload(filePath, file, {
                contentType:"application/pdf",
                upsert:false
            });


        if(storageError){

            throw storageError;

        }


        /* =========================
           GET PUBLIC URL
        ========================= */

        const { data: publicUrlData } =
            supabaseClient
            .storage
            .from("materials")
            .getPublicUrl(filePath);


        const fileUrl =
            publicUrlData.publicUrl;


        /* =========================
           SAVE DATA TO DATABASE
        ========================= */

        const { data: databaseData, error: databaseError } =
            await supabaseClient
            .from("materials")
            .insert([
                {
                    title: title,
                    category: category,
                    subject: subject,
                    form_class: formClass,
                    file_url: fileUrl
                }
            ])
            .select();


        if(databaseError){

            throw databaseError;

        }


        /* =========================
           SUCCESS
        ========================= */

        message.innerHTML =
            "✅ <strong>Upload successful!</strong><br>" +
            "The material has been saved successfully.";


        document
        .getElementById("uploadForm")
        .reset();


    }catch(error){

        console.error(error);

        message.innerHTML =
            "❌ Upload failed.<br>" +
            error.message;

    }


    uploadButton.disabled = false;

    uploadButton.innerText =
        "📤 UPLOAD PDF";

});

</script>


</body>

</html>
